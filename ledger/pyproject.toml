[project]
name = "brainir-ledger"
version = "0.1.0"
description = "BrainIR prediction ledger: pre-registered DN activation predictions, blind real-fly labels, one-shot scoring."
requires-python = ">=3.12,<3.13"
# The root pyproject.toml / uv.lock are hashed by the Phase 1 benchmark lock, so the ledger lives in its own project
# (precedent: phase3/, phase4/). The numerical stack is pinned to the root uv.lock versions so simulations use the same
# numerics as the root environment; the Modal image pins the same versions (brainir_ledger.backend.PINNED).
dependencies = [
    "brainir",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "networkx==3.7",
    "duckdb==1.5.5",
    "modal==1.5.5",
    "requests==2.34.2",
    "google-crc32c==1.8.0",
]

[tool.uv.sources]
brainir = { path = "..", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainir_ledger"]

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 155
