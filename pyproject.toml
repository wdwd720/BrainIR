[project]
name = "brainir"
version = "0.0.1"
description = "BrainIR: decompiling biological neural circuits into compact, executable, testable programs. Phase 0: data & research foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary (code); datasets retain their own licenses, see data/manifests" }
dependencies = [
    "duckdb>=1.1",
    "google-crc32c>=1.5",
    "networkx>=3.3",
    "neuprint-python>=0.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "requests>=2.32",
    "scipy>=1.13",
]

[project.scripts]
brainir = "brainir.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainir"]

[tool.uv]
# The system-wide CPython 3.12 on the original dev machine is a broken install
# (missing Lib/encodings). Always use uv-managed interpreters for reproducibility.
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "tabulate>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["real_data: needs the processed MaleCNS v1.0 build under data/processed"]

[tool.ruff]
line-length = 155
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702", "B905"]
